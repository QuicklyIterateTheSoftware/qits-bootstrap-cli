archetype: cli

# THE CONSUMER PACTS (qits-1149): what the bootstrap asks each qits service, written by
# BootstrapPactFileTest from the providers' golden masters and committed as
# pacts/qits-bootstrap-cli_<provider>.json. The platform packs each as
# `eu.wohlben.qits:qits-bootstrap-cli-pacts-<provider>`, only when it changed, from the release slot's
# last step; the provider pins that jar and verifies it. A key here must name exactly a provider that
# has a file in pacts/ — BootstrapPactFileTest writes one only for a provider with a recorded row.
contracts:
  application: qits-bootstrap-cli
  pacts:
    qits-projects-service: { packages: [maven] }
    qits-events-service: { packages: [maven] }

# THE cli ARCHETYPE'S QA STEP, WITH THE PLATFORM REGISTRY ADDED. Declaring the slot replaces the
# archetype's whole, so this is its step byte for byte plus one export: the pact tests read the
# providers' golden masters jars, which only the platform's Maven serves (the `qits-maven` repository
# the pom declares, mirrored by .qits-maven-settings.xml to QITS_MAVEN_REPOSITORY_URL).
release-request:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 1800
    script: |
      qits_domain=${QITS_DOMAIN:?this step was told no QITS_DOMAIN}
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"

      # The coverage agent and the pact verification report: the archetype's lines, unchanged.
      jacoco_version=0.8.14
      jacoco_agent=/tmp/qits-jacoco/org.jacoco.agent-$jacoco_version-runtime.jar
      jacoco_url="$QITS_MAVEN_CENTRAL_URL/org/jacoco/org.jacoco.agent/$jacoco_version/org.jacoco.agent-$jacoco_version-runtime.jar"
      set --
      if [ -n "${QITS_TOKEN:-}" ]; then
        set -- "Authorization: Bearer $QITS_TOKEN"
      fi
      jacoco_options=""
      mkdir -p /tmp/qits-jacoco .qits-reports/pact-verification
      if curl -fsSL --retry 2 ${1:+-H} "$@" -o "$jacoco_agent" "$jacoco_url" 2>/dev/null \
        || wget -q ${1:+--header} "$@" -O "$jacoco_agent" "$jacoco_url" 2>/dev/null; then
        jacoco_options="-javaagent:$jacoco_agent=destfile=$PWD/.qits-reports/jacoco.exec,append=true,includes=eu.wohlben.*"
      else
        echo "coverage: could not fetch the JaCoCo $jacoco_version agent; this verify runs without coverage"
      fi
      pact_options="-Dpact.verification.reports=json -Dpact.verification.reportDir=$PWD/.qits-reports/pact-verification"

      env "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }${jacoco_options:+$jacoco_options }$pact_options" \
        ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"

# A RELEASE SLOT, AND ONLY FOR THE PACTS. The archetype has none — this CLI ships no artifact — but
# the platform publishes contract packages from the release slot's last step, so a repository with
# `contracts:` needs one. The step builds nothing: the QA step already proved the committed files,
# and the postlude packs them from the checkout.
release:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 600
    script: |
      ls pacts/
