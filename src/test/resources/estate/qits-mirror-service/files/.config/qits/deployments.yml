# How qits-deployments deploys this repo. It reads this file from the git host at the built sha, so
# the answer travels with the commit.
#
# CARRYING THE FILE AT ALL is the other thing it says. The release flow reads it to decide whether
# this repository deploys — a library or an SPA carries none, and its `main` is finalized at the
# release itself rather than after a deployment.
#
# THE NAME THIS DEPLOYS AS, spelled because the repository is renamed and the application is not.
# Every derivation the deployer makes hangs off this name — the wire alias peers dial, the container
# it manages, the extras family, the database — so letting it follow the repository would
# decommission the running service and start a stranger beside it.
application: qits-mirror

# WHAT THIS APPLICATION USED TO BE CALLED, and the one thing a rename is allowed to move.
#
# A renamed application is a NEW application to the deployer: services are keyed by name, swarm
# cannot rename one, and pd_service / pd_deployment / pd_resource all hold an application name and
# no repository identity. So this deploys BESIDE qits-platform-mirror and an operator retires the
# predecessor afterwards. That half is unchanged.
#
# What this line moves is the DATABASE CLAIM. Without it the successor's first deploy is refused —
# "the database qits_platform_mirror is already provisioned for qits-platform-mirror" — which is the
# right refusal in general, because two unrelated repositories sharing a store is worse than a loud
# failure. Naming the predecessor narrows that check to this one row rather than weakening it.
#
# It also preserves the CREDENTIAL: the claim row is read one statement later to decide whether to
# send the stored password or a fresh one, so transferring it first means the predecessor — still
# running, with open pools on that role — keeps working. Removing this line after the rename does not
# tidy anything up; it re-arms the refusal.
renamed_from: qits-platform-mirror

# One route for this application's machine surface: the admin API at /mirror/api and health at
# /mirror/q. Both are reached on this application's own host, mirror.<domain> — the hostname picks
# the application, and this line is what keeps the prefix reachable there. The client itself is no
# longer under it — it is served at / on this application's own host. The three cache roots are not
# here either: they are reached on this application's host directly.
routes: /mirror

# WHERE THIS APPLICATION HANGS IN THE SIDEBAR. `system` is the global group — this service is about
# the platform rather than about one project — and 2 is the position inside it.
#
# The host is not spelled because the derived one is already right: the application name minus its
# `qits-` prefix is `mirror`, which is the label dockerd, npm and maven already dial. It used to be
# the name minus `qits-platform-`, and the label did not move when the prefix went — which is the
# point of deriving it. The browser plane and the machine plane land on the same authority by
# design, not by accident.
navigation-entries: system.Mirror:2

# A postgres role and database of this application's own, created on the tier's postgres BEFORE the
# successor container starts and injected as QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD.
#
# The database name is not spelled because the default is right: it derives from the application name
# with the `qits-` prefix dropped and dashes turned to underscores, so this asks for
# `qits_platform_mirror`, and a name written out here would be a second copy of one answer.
#
# application.properties maps those three variables onto quarkus.datasource.mirror.* with no defaults
# behind them. Without this line the container has no database and dies at Flyway's migrate-at-start
# naming the missing variable — which is the failure worth having: a cache that invented an empty
# store would answer every lookup as a miss, refetch the internet on every build, and report nothing.
# THE DATABASE IS NAMED EXPLICITLY, AND IT IS A SAFETY PIN RATHER THAN A PREFERENCE.
# `postgresql:db` with no third segment DERIVES the database from the APPLICATION name —
# `qits_` plus the name minus its `qits-` prefix. This application is STILL TO BE renamed
# (qits-platform-mirror -> qits-mirror), so a derived name would ask for `qits_mirror`: the deployment
# would provision a BRAND NEW EMPTY database and start against it, on a green deploy, with nothing
# failing and every cached byte unreachable. This line is what makes the rename a rename of the
# APPLICATION alone, which is the whole intent — and it has to OUTLIVE the rename, not just precede
# it. Removing it later is not a tidy-up; it is a silent migration to an empty store.
#
# VERIFIED AGAINST THE SERVER, not derived: `qits_platform_mirror` is in pg_database on
# qits-oci-postgresql today, and `qits_mirror` is not.
#
# idp:client ASKS QITS-DEPLOYMENTS TO PROVISION THIS APPLICATION'S OWN QITS-IDP SERVICE CLIENT — id
# `<env>-qits-mirror` (derived from env + application), roles fixed in qits-idp code. The deployer
# stores the secret the way it stores the database password, and injects QITS_RESOURCE_IDP_URL,
# QITS_RESOURCE_IDP_CLIENT_ID and QITS_RESOURCE_IDP_CLIENT_SECRET, which the `qits` oidc client in
# application.properties reads. It is the bearer qits-telemetry-core attaches to every OTLP export,
# now that this service ships its telemetry to qits-observability's edge host, where the edge
# refuses an anonymous request (epic qits-428). Independent of qits.auth.machine.required.
resources: postgresql:db:qits_platform_mirror, idp:client

# THE PROBE THE DEPLOY GATES ON, SPELLED OUT BECAUSE THE DERIVED DEFAULT IS WRONG. The default would
# be /platform-mirror/q/health/ready — the repository name minus `qits-`; this application serves its
# non-application root at /mirror/q (quarkus.http.non-application-root-path), which is the
# application's own name minus the prefix. A derived default is only ever right where the route
# prefix and the served prefix are the same string.
#
# Readiness rather than liveness, and the difference is not cosmetic: quarkus-agroal registers a
# readiness check for the `mirror` datasource as soon as a health extension is present, so this path
# is red while the database asked for above is unreachable. Liveness answers UP with an empty check
# list — a process that boots and cannot read its cache index would pass it, and that container is
# the one this deploy must not promote.
health_path: /mirror/q/health/ready

# WHAT THIS FILE CANNOT SAY, so that nobody looks for it here. The repository declaration owns
# public route metadata (`routes`, `upstream_port`, `host`, `navigation-entries`), but it still says
# nothing about publishes, volumes or environment. Those are run-args, and they live on the
# deployer's config volume, written by the bootstrap CLI. An unknown key here fails the deployment.

# THERE IS DELIBERATELY NO `update_order:` HERE, so the default start-first stands: the successor
# must pass its readiness probe before the predecessor stops. Under stop-first this service sat at
# zero tasks for a few seconds per deploy, swarm DNS answered no-such-host for its name and its
# aliases in that window, and every CI build dialling it then went red (qits-581). The old reason —
# a published host port — is gone: live `ports: None`, and nothing in the deployer's extras or the
# bootstrap ComposeTemplate publishes one.

# qits-1170: how long swarm lets the predecessor task keep running after SIGTERM before SIGKILL.
# The old task is pulled from the load balancer and gets no new connections the moment SIGTERM
# lands, so this grace buys nothing for new traffic — it only lets whatever is already in flight
# finish: a maven jar or an OCI layer still streaming to a build. A cold pull-through can run long
# (quarkus.vertx.max-worker-execute-time=PT30M upstream), so a short grace cuts those downloads
# exactly as a missing one would. 10m covers the 200 MB artifacts and layers builds were losing; it is
# below that 30-minute worst case on purpose, because every deploy can hold an old task this long.
# application.properties'
# quarkus.shutdown.timeout sits just under this value, not above it, so Quarkus closes the drain on
# its own terms before swarm forces the issue.
stop_grace_period: 10m
