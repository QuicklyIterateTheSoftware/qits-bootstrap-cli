# This program owns the terminal, so the framework must not write to it. Quarkus' own INFO lines
# would land in the middle of a repainted frame; anything worth saying goes through the display or
# the run log instead.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.level=WARN

# The jar form is one file: `java -jar target/qits-cli-bootstrap-1.0.0-SNAPSHOT-runner.jar`. A CLI
# that is copied to a workstation should not arrive as a directory of parts. The form people run is
# the native binary; see the `native` profile in the pom.
quarkus.package.jar.type=uber-jar

# The browser view. The knobs are the CLI's own names (BootstrapConfig reads the same keys, so
# QITS_WEB_PORT and .env work here too); the defaults are repeated because an expression cannot
# see a mapping's default.
#
# 8480 rather than anything near 8080: 8080 is qits-platform-edge, 8081 is qits-platform-artifacts,
# and 8090 is taken often enough on a workstation to be a poor default.
#
# QITS_WEB_BIND, NOT QITS_WEB, and it defaults to NOT BINDING. The same binary runs twice per
# bootstrap: once on the host, where it builds the payload image and starts a container, and once
# inside that container, where the phases run. Only the second one may hold the port — the first
# would be holding the very port the second publishes, and every run would fail on "port is already
# allocated". So the launcher answers this for the payload, from QITS_WEB, which stays the knob a
# person sets: QITS_WEB=0 is still no server, no port, no page.
quarkus.http.host-enabled=${qits.web-bind:false}
quarkus.http.port=${qits.web-port:8480}
quarkus.http.host=${qits.web-host:0.0.0.0}

# The tests take whatever port is free. 8081 is qits-platform-artifacts on a machine that has been
# bootstrapped, and a test suite must not depend on that being down. The view's own test serves
# from a real server, so the test profile binds one.
%test.quarkus.http.host-enabled=true
%test.quarkus.http.test-port=0
%test.quarkus.http.host=127.0.0.1

# No datasource is configured and no DataSource is injected: quarkus-jdbc-postgresql is here for
# the driver alone, and the seed-postgres phase opens its own connections with DriverManager. Dev
# services would otherwise read "a JDBC extension with no datasource" as "start a postgres
# container", which `./mvnw clean verify` must never need.
quarkus.devservices.enabled=false
