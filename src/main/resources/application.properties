# This program owns the terminal, so the framework must not write to it. Quarkus' own INFO lines
# would land in the middle of a repainted frame; anything worth saying goes through the display or
# the run log instead.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.level=WARN

# One file to run: `java -jar target/qits-cli-bootstrap-1.0.0-SNAPSHOT-runner.jar`. A CLI that is
# copied to a workstation should not arrive as a directory of parts.
quarkus.package.jar.type=uber-jar


# JLine reaches the terminal through the foreign function API, which warns once per run unless the
# jar says it means to. The warning would be the first thing on a screen this program then repaints.
quarkus.package.jar.manifest.attributes."Enable-Native-Access"=ALL-UNNAMED
