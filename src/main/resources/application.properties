# This program owns the terminal, so the framework must not write to it. Quarkus' own INFO lines
# would land in the middle of a repainted frame; anything worth saying goes through the display or
# the run log instead.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.level=WARN

# The jar form is one file: `java -jar target/qits-cli-bootstrap-1.0.0-SNAPSHOT-runner.jar`. A CLI
# that is copied to a workstation should not arrive as a directory of parts. The form people run is
# the native binary; see the `native` profile in the pom.
quarkus.package.jar.type=uber-jar

# The browser view. The knobs are the CLI's own names (BootstrapConfig reads the same three keys,
# so QITS_WEB_PORT and .env work here too); the defaults are repeated because an expression cannot
# see a mapping's default.
#
# 8480 rather than anything near 8080: 8080 is the gateway, 8081 is qits-artifacts, and 8090 is
# taken often enough on a workstation to be a poor default. 127.0.0.1 so a bootstrap on a laptop
# is not on the network it happens to be joined to.
#
# QITS_WEB=0 turns it off by never binding — no server, no port, no page.
quarkus.http.host-enabled=${qits.web:true}
quarkus.http.port=${qits.web-port:8480}
quarkus.http.host=${qits.web-host:127.0.0.1}

# The tests take whatever port is free. 8081 is qits-artifacts on a machine that has been
# bootstrapped, and a test suite must not depend on that being down.
%test.quarkus.http.test-port=0
%test.quarkus.http.host=127.0.0.1
