<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Qits bootstrap status</title><body><main><h1>Qits bootstrap status</h1><p id="state">Loading status…</p><dl><dt>Command</dt><dd id="command">—</dd><dt>Process</dt><dd id="process">—</dd><dt>Started</dt><dd id="started">—</dd><dt>Heartbeat</dt><dd id="heartbeat">—</dd><dt>Phase</dt><dd id="phase">—</dd></dl><p id="detail"></p><p>Only redacted progress is shown here. This endpoint remains online if the bootstrap payload exits.</p></main><script>const put=(id,v)=>document.getElementById(id).textContent=v||"—";async function refresh(){try{let s=await fetch("/status.json?"+Date.now(),{cache:"no-store"}).then(r=>r.json());put("state",s.state);put("command",s.command);put("process",s.pid);put("started",s.started);put("heartbeat",s.heartbeat);put("phase",s.phase);put("detail",s.detail)}catch(e){put("state","Status feed temporarily unavailable")}}refresh();setInterval(refresh,5000)</script></body></html>
